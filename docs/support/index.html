  <h2>常见问题</h2>
  <p><strong>数据存在哪里？</strong> 默认仅在本机；请定期使用「备份」导出 JSON 留存。</p>
  <p><strong>换机如何迁移？</strong> 在旧机导出备份，在新机安装 App 后从剪贴板或文件内容导入。</p>
  <p><strong>课前提醒不响？</strong> 请在系统设置中允许「课消本」通知；在 App 内打开提醒并确保未来有排课。正式验证建议使用 TestFlight 构建而非 Expo Go。</p>
