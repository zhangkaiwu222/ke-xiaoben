# Codemagic CI — 课消本 iOS 构建并发布到 TestFlight
# 文档: https://docs.codemagic.io/yaml-code-signing/alternative-code-signing-methods/
#
# 签名方式: 环境变量自动签名（无需在 Codemagic UI 上传证书/描述文件）
# 前置: 团队变量组 kexiaoben_asc 中包含以下加密变量:
#   APP_STORE_CONNECT_PRIVATE_KEY    (.p8 全文)
#   APP_STORE_CONNECT_KEY_IDENTIFIER (Key ID)
#   APP_STORE_CONNECT_ISSUER_ID      (Issuer ID)
#   CERTIFICATE_PRIVATE_KEY          (Distribution 证书私钥 PEM, 构建时自动创建/复用证书)

workflows:
  ios-testflight:
    name: 课消本 iOS → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - kexiaoben_asc
      vars:
        APP_STORE_APPLE_ID: 6832416586
        BUNDLE_ID: com.zhangkaiwu222.kexiaoben
      node: 20
      xcode: latest

    scripts:
      - name: 安装 npm 依赖
        script: |
          npm ci

      - name: Expo prebuild 生成 iOS 原生工程
        script: |
          npx expo prebuild --platform ios --clean

      - name: 设置 ITSAppUsesNonExemptEncryption（避免每次上传要求出口合规问答）
        script: |
          # 只取 ios/<AppName>/Info.plist，避免误改 Pods 里的 plist
          PLIST=$(find "$CM_BUILD_DIR/ios" -mindepth 2 -maxdepth 2 -name "Info.plist" -not -path "*/Pods/*" | head -1)
          echo "使用 Info.plist: $PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null || true

      - name: 安装 CocoaPods 依赖
        script: |
          cd $CM_BUILD_DIR/ios && pod install --repo-update

      - name: 探测 Xcode workspace 与 scheme 名称（pod install 之后）
        script: |
          echo "--- ios 目录 ---"
          ls -la "$CM_BUILD_DIR/ios"
          echo "--- ios 根目录下的 workspace (glob) ---"
          # 必须用 shell glob 只取 ios 根目录一层：
          # find 会命中 Xcode 自动生成的 app.xcodeproj/project.xcworkspace，
          # 那个 workspace 不含 Pods，编译会报 no such module 'Expo'。
          for d in "$CM_BUILD_DIR/ios/"*.xcworkspace; do
            echo "$d"
          done
          echo "--- 所有共享 scheme ---"
          find "$CM_BUILD_DIR/ios" -name "*.xcscheme"

      - name: 初始化签名钥匙串
        script: keychain initialize

      - name: 从 Apple 获取/创建证书与描述文件（自动签名）
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: 将证书加入钥匙串
        script: keychain add-certificates

      - name: 配置代码签名（应用描述文件到 Xcode 工程）
        script: xcode-project use-profiles

      - name: 递增构建号（基于 App Store 最新版本）
        script: |
          cd $CM_BUILD_DIR/ios
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          echo "线上最新构建号: $LATEST"
          NEW=$((LATEST + 1))
          echo "新构建号: $NEW"
          agvtool new-version -all "$NEW"

      - name: 构建 IPA
        script: |
          set -e
          echo "--- 诊断: 当前环境变量 ---"
          echo "CM_BUILD_DIR=[$CM_BUILD_DIR]"
          echo "XCODE_WORKSPACE(平台预留)=[$XCODE_WORKSPACE]"
          echo "KXB_WS_NAME(自定义)=[$KXB_WS_NAME]"
          echo "--- ios 目录 ---"
          ls -la "$CM_BUILD_DIR/ios"
          # 用 glob 只匹配 ios 根目录一层的 workspace，排除 xcodeproj 内部的 project.xcworkspace
          WS_PATH=""
          for d in "$CM_BUILD_DIR/ios/"*.xcworkspace; do
            if [ -d "$d" ]; then WS_PATH="$d"; break; fi
          done
          if [ -z "$WS_PATH" ]; then
            echo "错误: ios 根目录下未找到 xcworkspace"; exit 1
          fi
          WS_NAME=$(basename "$WS_PATH" .xcworkspace)
          if [ -f "$CM_BUILD_DIR/ios/$WS_NAME.xcodeproj/xcshareddata/xcschemes/$WS_NAME.xcscheme" ]; then
            SCHEME="$WS_NAME"
          else
            SCHEME=$(find "$CM_BUILD_DIR/ios" -path "*/xcshareddata/xcschemes/*.xcscheme" | head -1 | xargs basename | sed 's/\.xcscheme$//')
          fi
          echo "最终使用: workspace=$WS_PATH scheme=$SCHEME"
          xcode-project build-ipa \
            --workspace "$WS_PATH" \
            --scheme "$SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM

    publishing:
      app_store_connect:
        # 使用环境变量中的 ASC API 密钥认证
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # 第一步先发 TestFlight 验证，不自动提审
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - zhangkaiwu555@gmail.com
        notify:
          success: true
          failure: true
